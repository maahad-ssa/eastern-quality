<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eastern Renaissance Quality Trading Company</title>

    <meta
        name="description"
        content="Eastern Renaissance Quality Trading Company - Your Trusted Partner in Customs Clearance & Logistics"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="slideshow" id="slideshow">

        <!-- Slides -->
        <div class="slides-container">

            <img
                src="slides/slide-01.webp"
                class="slide active"
                alt="Eastern Renaissance Quality Trading Company - Company Profile"
            >

            <img
                src="slides/slide-02.webp"
                class="slide"
                alt="Company Overview"
            >

            <img
                src="slides/slide-03.webp"
                class="slide"
                alt="Our Core Services"
            >

            <img
                src="slides/slide-04.webp"
                class="slide"
                alt="Market Reach and Coverage"
            >

            <img
                src="slides/slide-05.webp"
                class="slide"
                alt="Operational Workflow"
            >

            <img
                src="slides/slide-06.webp"
                class="slide"
                alt="Why Choose Us"
            >

            <img
                src="slides/slide-07.webp"
                class="slide"
                alt="Contact and Next Steps"
            >

        </div>


        <!-- Previous Button -->
        <button
            class="nav-button prev"
            id="prevButton"
            aria-label="Previous slide"
        >
            &#10094;
        </button>


        <!-- Next Button -->
        <button
            class="nav-button next"
            id="nextButton"
            aria-label="Next slide"
        >
            &#10095;
        </button>


        <!-- Bottom Controls -->
        <div class="controls">

            <!-- Slide Counter -->
            <div class="slide-counter" id="slideCounter">
                1 / 7
            </div>

            <!-- Dots -->
            <div class="dots" id="dots">

                <button class="dot active" data-slide="0"></button>
                <button class="dot" data-slide="1"></button>
                <button class="dot" data-slide="2"></button>
                <button class="dot" data-slide="3"></button>
                <button class="dot" data-slide="4"></button>
                <button class="dot" data-slide="5"></button>
                <button class="dot" data-slide="6"></button>

            </div>

            <!-- Fullscreen -->
            <button
                class="fullscreen-button"
                id="fullscreenButton"
                aria-label="Enter fullscreen"
                title="Fullscreen"
            >
                ⛶
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
